name: sign_language_app
description: "ASL Sign Language Recognition Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  flutter_tts: ^4.2.0
  provider: ^6.1.5
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  permission_handler: ^11.4.0
  shimmer: ^3.0.0
  speech_to_text: ^7.0.0
  video_player: ^2.8.2
  google_nav_bar: ^5.0.6
  http: ^1.2.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  flutter_cache_manager: ^3.4.2
  shared_preferences: ^2.5.5
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/database/
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0F0F23"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#0F0F23"
  image: "assets/images/app_icon.png"
  android_12:
    image: "assets/images/app_icon.png"
    icon_background_color: "#0F0F23"
    color: "#0F0F23"
