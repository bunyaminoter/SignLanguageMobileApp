name: sign_language_app
description: "ASL Sign Language Recognition Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.1
  flutter_tts: ^4.2.0
  provider: ^6.1.5
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  permission_handler: ^11.4.0
  shimmer: ^3.0.0
  speech_to_text: ^7.0.0
  video_player: ^2.8.2
  google_nav_bar: ^5.0.6
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
